name: Deploy Epsilon web IDE to GitHub Pages

on:
  push:
    branches: [main, claude/math-language-proof-system-2kyqyu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site
        run: |
          python -m pip install --upgrade pip build
          # regenerates web/ from epsilon/server/static + web/shell,
          # and rebuilds the wheel micropip installs in the browser
          python scripts/build_web.py --wheel

      - name: Sanity-check the site
        run: |
          test -f web/index.html
          test -f web/boot.js
          test -f web/bridge.py
          test -f web/app.js
          test -f web/panes.js
          test -f web/app.css
          test -f web/web.css   # web-only overrides (not copied from server)
          ls web/epsilon_math-*.whl
          # the generated site must match what is committed (the wheel is
          # rebuilt here, so its bytes legitimately differ)
          git diff --exit-code -- web/ ':(exclude)web/*.whl'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
