name: Deploy Epsilon web IDE to GitHub Pages

on:
  push:
    branches: [main, claude/math-language-proof-system-2kyqyu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site
        run: |
          # web/ is authored directly; this only stamps the cache-busting
          # build id derived from the asset contents
          python scripts/build_web.py

      - name: Sanity-check the site
        run: |
          test -f web/index.html
          test -f web/epsilon.css
          test -f web/editor.js
          test -f web/app.js
          # the committed site must match what the script produces
          git diff --exit-code -- web/
          # and it must reach nothing but the Python runtime
          ! grep -rEn 'https?://' web/*.html web/*.js web/*.css \
            | grep -v 'cdn.jsdelivr.net/pyodide' \
            | grep -v 'www.w3.org' || (echo "unexpected external reference"; exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
