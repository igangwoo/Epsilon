<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Epsilon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d6e70'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%CE%B5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="epsilon.css?v=e52bf9239760" />
</head>
<body>

<nav id="langs" class="ui" aria-label="Language"></nav>
<button id="theme" class="ui" aria-label="Toggle colour theme">dark</button>

<main>
  <div id="stage">
    <div id="gutter" aria-hidden="true"></div>
    <div id="page">
      <pre id="paint" aria-hidden="true"><code></code></pre>
      <textarea id="code" spellcheck="false" autocomplete="off"
                autocapitalize="off" autocorrect="off" wrap="off"
                aria-label="Source code"></textarea>
      <div id="caret" aria-hidden="true"><i id="caretBar"></i></div>
      <div id="hints" role="listbox" aria-label="Completions" hidden></div>
    </div>
  </div>

  <div id="rule"><div id="sweep"></div></div>

  <div id="foot">
    <button id="run" class="ui">run<span class="key">⌘↵</span></button>
    <button id="stdinBtn" class="ui quiet">stdin</button>
    <span class="grow"></span>
    <span id="pos" class="ui quiet">1:1</span>
    <span id="state" class="ui quiet">ready</span>
  </div>

  <div id="stdinWrap" hidden>
    <textarea id="stdin" rows="2" spellcheck="false"
              placeholder="input fed to the program"></textarea>
  </div>

  <section id="out" aria-live="polite"></section>
</main>

<div id="boot">
  <div class="mark">ε</div>
  <div class="track"><div id="bootBar"></div></div>
  <div id="bootMsg" class="ui quiet">starting</div>
</div>

<script src="editor.js?v=e52bf9239760"></script>
<script src="app.js?v=e52bf9239760"></script>
</body>
</html>
