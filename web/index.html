<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epsilon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c78ff'/%3E%3Ctext x='16' y='23' font-size='21' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%CE%B5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="app.css?v=3e8605295467" />
  <!-- web-only overrides; app.css stays the shared source of truth -->
  <link rel="stylesheet" href="web.css?v=3e8605295467" />
  <script src="vfs.js?v=3e8605295467"></script>
  <style>
    /* one-time boot overlay while Pyodide + the engine load */
    #boot {
      position: fixed; inset: 0; z-index: 100; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #e6e6ef;
      background:
        radial-gradient(940px 520px at 12% -14%, rgba(139,132,255,0.16), transparent 62%),
        radial-gradient(820px 460px at 96% 112%, rgba(69,220,200,0.10), transparent 60%),
        #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, sans-serif; transition: opacity 0.4s ease;
    }
    #boot .logo {
      width: 74px; height: 74px; border-radius: 22px; display: grid;
      place-items: center; font: 700 42px Georgia, serif; color: #fff;
      background: linear-gradient(145deg, #8b84ff, #45dcc8);
      box-shadow: 0 12px 50px rgba(139, 132, 255, 0.45);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    #boot .title { font-size: 22px; font-weight: 650; letter-spacing: 0.3px; }
    #boot .track { width: min(340px, 70vw); height: 6px; border-radius: 6px;
      background: rgba(255,255,255,0.1); overflow: hidden; }
    #bootBar { height: 100%; width: 0; border-radius: 6px;
      background: linear-gradient(90deg, #8b84ff, #45dcc8); transition: width 0.3s ease; }
    #bootMsg { font-size: 13px; color: #a0a0b4; }
    #bootDetail { font-size: 11px; color: #6e6e85; min-height: 14px; }
    .boot-error { max-width: 440px; margin-top: 8px; padding: 14px 16px;
      border-radius: 12px; background: rgba(255,92,114,0.12);
      border: 1px solid rgba(255,92,114,0.4); font-size: 12.5px; line-height: 1.5;
      color: #ffb3bf; }
    /* a failure after the IDE is up has no boot overlay to live in */
    .boot-banner {
      position: fixed; inset: auto 16px 16px auto; z-index: 200;
      max-width: min(440px, calc(100vw - 32px));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .boot-retry {
      margin-top: 10px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(255,92,114,0.5); background: rgba(255,92,114,0.15);
      color: #ffb3bf; font: inherit; font-size: 12.5px;
    }
    .boot-retry:hover { background: rgba(255,92,114,0.28); }
    .boot-retry + .boot-retry { margin-left: 8px; }
    .boot-where { font-size: 11px; opacity: 0.75; font-family: ui-monospace,
      SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { #boot .logo { animation: none; } }
  </style>
</head>
<body>
  <!-- the colour field the workbench floats on; purely decorative -->
  <div class="wb-aurora" aria-hidden="true">
    <span class="wb-aurora-a"></span>
    <span class="wb-aurora-b"></span>
    <span class="wb-aurora-c"></span>
  </div>

  <div id="boot">
    <div class="logo">ε</div>
    <div class="title">Epsilon</div>
    <div class="track"><div id="bootBar"></div></div>
    <div id="bootMsg">Starting…</div>
    <div id="bootDetail"></div>
  </div>

  <div id="workbench" class="wb-root">

    <!-- title bar: menus on the left, run controls in the middle-right -->
    <header id="titlebar" class="wb-titlebar">
      <span class="wb-brand" title="Epsilon">
        <span class="wb-brand-mark" aria-hidden="true">ε</span>
        <span class="wb-brand-name">Epsilon</span>
      </span>
      <nav id="menubar" class="wb-menubar" role="menubar"
           aria-label="Application menu"></nav>
      <div class="wb-title-spacer"></div>
      <button id="quickOpen" class="wb-omni" title="Go to File (Ctrl+P)">
        <span class="wb-omni-text">Search files and commands</span>
        <span class="wb-omni-key">⌘P</span>
      </button>
      <div class="wb-title-spacer"></div>
      <div id="runControls" class="wb-run-controls"></div>
    </header>

    <div class="wb-main">
      <!-- activity bar -->
      <nav id="activitybar" class="wb-activitybar"
           aria-label="Primary views"></nav>

      <!-- primary sidebar -->
      <aside id="sidebar" class="wb-sidebar" aria-label="Sidebar">
        <div class="wb-side-titlerow">
          <span id="sidebarTitle" class="wb-side-title">EXPLORER</span>
        </div>

        <section class="wb-side-view" data-view="explorer">
          <div class="wb-side-actions">
            <button class="wb-icon-btn" id="explorerNewFile"
                    title="New File" aria-label="New File"></button>
            <button class="wb-icon-btn" id="explorerNewFolder"
                    title="New Folder" aria-label="New Folder"></button>
            <button class="wb-icon-btn" id="explorerRefresh"
                    title="Refresh" aria-label="Refresh Explorer"></button>
          </div>
          <ul id="explorerList" class="wb-tree" role="tree"
              aria-label="Files"></ul>
        </section>

        <section class="wb-side-view hidden" data-view="search">
          <div class="wb-search-form">
            <input id="searchInput" class="wb-input" type="text"
                   placeholder="Search" aria-label="Search query" />
            <div class="wb-search-opts">
              <button class="wb-search-opt" data-opt="case" title="Match Case"
                      aria-pressed="false">Aa</button>
              <button class="wb-search-opt" data-opt="word"
                      title="Match Whole Word" aria-pressed="false">ab</button>
              <button class="wb-search-opt" data-opt="regex"
                      title="Use Regular Expression"
                      aria-pressed="false">.*</button>
            </div>
            <input id="searchReplace" class="wb-input" type="text"
                   placeholder="Replace" aria-label="Replace with" />
            <button id="searchReplaceAll" class="wb-btn"
                    title="Replace all matches across the workspace">
              Replace All</button>
          </div>
          <div id="searchResults" class="wb-search-results"></div>
        </section>

        <section class="wb-side-view hidden" data-view="scm">
          <div id="scmBody" class="wb-scm"></div>
        </section>

        <section class="wb-side-view hidden" data-view="rundebug">
          <div id="runDebugBody" class="wb-rundebug"></div>
        </section>
      </aside>
      <div id="sideSash" class="wb-sash-v" role="separator"
           aria-orientation="vertical" aria-label="Resize sidebar"
           title="Drag to resize · double-click to reset"></div>

      <!-- editor area + bottom panel -->
      <div class="wb-center">
        <div id="editorArea" class="wb-editor-area"></div>

        <div id="panelSash" class="wb-sash-h" role="separator"
             aria-orientation="horizontal" aria-label="Resize panel"
             title="Drag to resize · double-click to reset"></div>
        <section id="panel" class="wb-panel" aria-label="Panel">
          <div id="panelTabs" class="wb-panel-tabs" role="tablist"></div>

          <div class="wb-panel-view" data-panel="terminal" role="tabpanel"
               aria-label="Terminal">
            <div id="termTabs" class="wb-term-tabs"></div>
            <div id="termScreen" class="wb-term-screen" tabindex="0"></div>
            <div id="termInputRow" class="wb-term-inputrow">
              <span class="wb-term-prompt" aria-hidden="true">›</span>
              <input id="termInput" class="wb-term-input" type="text"
                     autocomplete="off" spellcheck="false"
                     aria-label="Terminal input" />
            </div>
          </div>

          <div class="wb-panel-view hidden" data-panel="problems"
               role="tabpanel" aria-label="Problems">
            <div id="panelProblems" class="wb-problems"></div>
          </div>

          <div class="wb-panel-view hidden" data-panel="output"
               role="tabpanel" aria-label="Output">
            <div id="panelOutput" class="wb-output"></div>
          </div>

          <div class="wb-panel-view hidden" data-panel="debug"
               role="tabpanel" aria-label="Debug Console">
            <div id="dbgLog" class="wb-output"></div>
            <div class="wb-term-inputrow">
              <span class="wb-term-prompt" aria-hidden="true">›</span>
              <input id="dbgInput" class="wb-term-input" type="text"
                     autocomplete="off" spellcheck="false"
                     aria-label="Debug console input" />
            </div>
          </div>
        </section>
      </div>

      <!-- secondary sidebar: outline -->
      <aside id="auxbar" class="wb-auxbar hidden" aria-label="Outline">
        <div class="wb-side-titlerow">
          <span class="wb-side-title">OUTLINE</span>
        </div>
        <div id="outlineList" class="wb-outline"></div>
      </aside>
    </div>

    <!-- status bar -->
    <footer id="statusbar" class="wb-statusbar" aria-label="Status"></footer>
  </div>

  <!-- command palette -->
  <div id="paletteOverlay" class="wb-pal-overlay hidden" role="dialog"
       aria-label="Command palette">
    <div class="wb-pal">
      <input id="paletteInput" class="wb-pal-input" type="text"
             autocomplete="off" spellcheck="false"
             aria-label="Command palette input" />
      <div id="paletteList" class="wb-pal-list" role="listbox"></div>
    </div>
  </div>

  <!-- notifications -->
  <div id="toastStack" class="wb-toasts" aria-live="polite"></div>

  <!-- closed views park here so their DOM survives -->
  <div id="viewVault" class="hidden" aria-hidden="true"></div>

  <script src="core.js?v=3e8605295467"></script>
  <script src="editor.js?v=3e8605295467"></script>
  <script src="panes.js?v=3e8605295467"></script>
  <script src="boot.js?v=3e8605295467"></script>
</body>
</html>
